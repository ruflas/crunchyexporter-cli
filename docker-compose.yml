services:
  crunchyexporter:
    build:
      context: .
      dockerfile: Dockerfile
    image: crunchyexporter-cli:feature-docker-headless
    container_name: crunchyexporter-cli
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      PYTHONUNBUFFERED: "1"
      CRUNCHY_DAEMON_INTERVAL: "3600"
      CRUNCHY_DAEMON_TARGET: "status"
    command: ["daemon"]
    healthcheck:
      test: ["CMD", "python", "src/main.py", "status"]
      interval: 1m
      timeout: 10s
      retries: 3
